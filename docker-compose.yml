services:
  surrealdb:
    image: surrealdb/surrealdb:v3.2.0
    container_name: okapi-edge-surreal
    user: root
    command: >
      start --log info
      --user ${SURREAL_USER:-root}
      --pass ${SURREAL_PASS:-changeme}
      --bind 0.0.0.0:8000
      rocksdb:/data
    ports:
      - "${SURREAL_PORT:-8000}:8000"
    volumes:
      - surreal_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "-e", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

volumes:
  surreal_data:
